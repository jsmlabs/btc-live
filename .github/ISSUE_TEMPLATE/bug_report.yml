name: Bug report
description: Report a reproducible BTC Live defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Distinguish the installed store build from the v16 development candidate. Do not post credentials, private data or sensitive recordings.
  - type: dropdown
    id: installation
    attributes:
      label: Installation source
      options:
        - Unpacked main development candidate
        - Browser store installation
        - Other or unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Manifest version and source commit (if known)
      placeholder: "1.22.0 / commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser version and operating system
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include connection status and feed freshness where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Add timestamps, errors, relevant network and screenshot evidence, without private information.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I checked existing issues and removed sensitive information.
          required: true
