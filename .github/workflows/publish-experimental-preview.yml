name: Publish Experimental Preview (Unverified)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter PUBLISH_UNTESTED_PREVIEW to acknowledge skipped acceptance tests'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: btc-live-experimental-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_UNTESTED_PREVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and unique experimental tag
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          assert.match(manifest.version, /^\\d+\\.\\d+\\.\\d+$/);
          assert.match(process.env.GITHUB_SHA, /^[a-f0-9]{40}$/);
          fs.appendFileSync(process.env.GITHUB_ENV, 'PREVIEW_TAG=v' + manifest.version + '-preview.' + process.env.GITHUB_RUN_ID + '\\n');
          NODE
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
      - name: Package untested candidate without acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-extension.mjs --skip-verify
          npm run package:metadata
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish explicitly unverified prerelease
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          package="dist/btc-live-chromium-v${version}-candidate.zip"
          test -f "$package"
          if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Preview release already exists'; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PREVIEW_TAG" >/dev/null 2>&1; then
            echo 'Preview tag already exists'; exit 1
          fi
          gh release create "$PREVIEW_TAG" "$package" dist/SHA256SUMS.txt dist/BUILD_INFO.json \\
            --repo "$GITHUB_REPOSITORY" \\
            --target "$GITHUB_SHA" \\
            --prerelease \\
            --title "BTC Live $PREVIEW_TAG - EXPERIMENTAL / UNTESTED" \\
            --notes "**EXPERIMENTAL, UNTESTED DEVELOPMENT CANDIDATE. NOT A STABLE RELEASE.** Chromium/MV3, Binance feeds, depth recovery, alerts, replay, migration and privacy acceptance are not established. No self-installation. This archive has manifest version ${version}; the preview tag is an artifact identifier, not a newer installed version. Verify SHA256SUMS.txt and manually load unpacked in a disposable Chromium profile."
      - name: Verify GitHub prerelease and assets
        run: |
          set -euo pipefail
          gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,assets > dist/preview-result.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r = JSON.parse(fs.readFileSync('dist/preview-result.json', 'utf8'));
          assert.equal(r.isDraft, false);
          assert.equal(r.isPrerelease, true);
          assert.equal(r.tagName, process.env.PREVIEW_TAG);
          assert.equal(r.assets.length, 3);
          NODE
