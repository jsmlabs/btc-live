name: One-time cleanup of merged BTC Live support branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'jsmlabs/btc-live' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove verified squash-merged support branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/optional-usdc-solana-support'
          expected='fea2cd67f443b720a13c90544f829558fd24a81c'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/71" --jq '.merged')" = true
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          test "$actual" = "$expected" || { echo 'Branch moved; refuse deletion'; exit 1; }
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          remaining="$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '[.[].name] | join(",")')"
          test "$remaining" = main || { echo "Unexpected branches remain: $remaining"; exit 1; }
          echo 'Only main remains.'
