name: One-time cleanup of merged BTC Live branches
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'jsmlabs/btc-live' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact squash-merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/liquidity-hover-tooltip-stability'
          expected='1ceafd12ddb90b6d05ecd29f374bea9ddc980b1b'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/70" --jq '.merged')" = true
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          test "$actual" = "$expected" || { echo 'Branch moved: deletion refused'; exit 1; }
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          branches="$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '[.[].name] | join(",")')"
          test "$branches" = main || { echo "Unexpected branches: $branches"; exit 1; }
          echo 'Verified: only main remains.'
