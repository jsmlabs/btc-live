name: Verify BTC Live Release Candidate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-live-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - run: npm run docs:check
      - run: npm run release:check
      - run: node scripts/package-extension.mjs --skip-verify
      - name: Validate candidate ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          paths=list(Path('dist').glob('btc-live-chromium-v*-candidate.zip'))
          assert len(paths)==1, f'Expected one package: {paths}'
          with ZipFile(paths[0]) as z:
              names=z.namelist()
              assert names==sorted(names) and len(names)==len(set(names))
              assert 'manifest.json' in names
              assert len(names)>50
              allowed={'app','background','dashboard','icons','market','popup','storage','ui','utils'}
              assert all(name=='manifest.json' or name.split('/')[0] in allowed for name in names)
              assert all(not name.startswith('/') and '..' not in name.split('/') for name in names)
              assert all(not n.startswith(('tests/','docs/','scripts/','store-assets/','.github/')) for n in names)
              assert all(i.date_time==(1980,1,1,0,0,0) for i in z.infolist())
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))
              assert paths[0].name == f"btc-live-chromium-v{manifest['version']}-candidate.zip"
              print(f'Validated {paths[0]}: {len(names)} files')
          PY
      - name: Verify reproducible package
        run: |
          sha256sum dist/*.zip > /tmp/btc-live-first.sha256
          node scripts/package-extension.mjs --skip-verify
          sha256sum dist/*.zip > /tmp/btc-live-second.sha256
          diff -u /tmp/btc-live-first.sha256 /tmp/btc-live-second.sha256
          cat /tmp/btc-live-second.sha256
      - name: Create candidate build checksums and provenance
        run: npm run package:metadata
      - name: Confirm candidate metadata
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const info=JSON.parse(fs.readFileSync('dist/BUILD_INFO.json')); assert.equal(info.release_status,'development-candidate'); assert.equal(info.commit,process.env.GITHUB_SHA); assert.match(info.artifact.sha256,/^[0-9a-f]{64}$/);"
          cd dist && sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: btc-live-candidate-zip
          path: |
            dist/*.zip
            dist/BUILD_INFO.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse native updater with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/update-btc-live.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          if (-not (Test-Path 'update-btc-live.bat')) { throw 'Missing Windows entrypoint' }
      - name: Exercise local Git update scenarios
        shell: powershell
        run: ./tests/windows-updater-git.integration.ps1

  chromium-ui-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run synthetic Chromium UI regression
        env:
          UI_SCREENSHOT_DIR: dist/ui-smoke-screenshots
        run: |
          mkdir -p dist
          npm run test:ui 2>&1 | tee dist/ui-smoke.log
      - name: Save Chromium evidence (synthetic fixtures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-ui-dom-evidence
          path: |
            dist/ui-smoke.log
            dist/ui-smoke-screenshots/
          if-no-files-found: warn
          retention-days: 14
