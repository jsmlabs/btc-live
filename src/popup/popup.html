<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>BTC Live</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell" aria-label="BTC Live market data">
    <section id="mainView" class="view">
      <header class="header">
        <div class="asset-identity">
          <div class="asset-mark" aria-hidden="true"><img src="../icons/icon32.png" alt=""></div>
          <div>
            <div class="eyebrow">BITCOIN</div>
            <div class="pair">BTC / USDT</div>
          </div>
        </div>

        <div class="header-actions">
          <div id="statusPill" class="status-pill" data-tone="neutral" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">INITIAL</span>
          </div>
          <button id="settingsButton" class="icon-button" type="button" aria-label="Open settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8.4A3.6 3.6 0 1 0 12 15.6 3.6 3.6 0 0 0 12 8.4Zm8 3.6-.1-1.2 1.8-1.4-2-3.4-2.3.9a8 8 0 0 0-2-1.2L15 3.2h-4l-.4 2.5a8 8 0 0 0-2 1.2L6.3 6l-2 3.4 1.8 1.4L6 12l.1 1.2-1.8 1.4 2 3.4 2.3-.9a8 8 0 0 0 2 1.2l.4 2.5h4l.4-2.5a8 8 0 0 0 2-1.2l2.3.9 2-3.4-1.8-1.4L20 12Z"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="price-block" aria-label="Current Bitcoin price">
        <div class="price-row">
          <div id="currentPrice" class="current-price">—</div>
          <div class="quote-asset">USDT</div>
        </div>
        <div id="changeLine" class="change-line" data-tone="neutral">
          <span id="priceChange">—</span>
          <span class="separator">•</span>
          <span id="priceChangePercent">—</span>
          <span class="period">24H</span>
        </div>
      </section>

      <div id="stateMessage" class="state-message" hidden aria-live="polite"></div>

      <section class="stats-grid" aria-label="24 hour market statistics">
        <article class="metric-card">
          <span class="metric-label">24H HIGH</span>
          <strong id="high24h" class="metric-value">—</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">24H LOW</span>
          <strong id="low24h" class="metric-value">—</strong>
        </article>
      </section>

      <section id="bidAskSection" class="market-row" aria-label="Best bid and ask">
        <div class="market-cell">
          <span class="metric-label">BID</span>
          <strong id="bidPrice" class="market-value">—</strong>
        </div>
        <div class="market-cell">
          <span class="metric-label">ASK</span>
          <strong id="askPrice" class="market-value">—</strong>
        </div>
        <div class="market-cell compact">
          <span class="metric-label">SPREAD</span>
          <strong id="spread" class="market-value">—</strong>
        </div>
      </section>

      <section id="volumeSection" class="volume-row" aria-label="24 hour quote volume">
        <span class="metric-label">24H VOLUME</span>
        <strong id="volume24h" class="volume-value">—</strong>
      </section>

      <footer class="footer">
        <span>BINANCE SPOT</span>
        <span id="lastUpdate">Waiting for data</span>
      </footer>
    </section>

    <section id="settingsView" class="view settings-view" hidden aria-label="Settings">
      <header class="settings-header">
        <div>
          <div class="eyebrow">BTC LIVE</div>
          <h1>Settings</h1>
        </div>
        <button id="closeSettingsButton" class="icon-button" type="button" aria-label="Close settings" title="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.8 6.8 17.2 17.2M17.2 6.8 6.8 17.2"/></svg>
        </button>
      </header>

      <div class="settings-list">
        <label class="setting-row">
          <span>
            <strong>Show Bid / Ask</strong>
            <small>Display best bid, best ask and spread.</small>
          </span>
          <input id="settingBidAsk" type="checkbox">
        </label>

        <label class="setting-row">
          <span>
            <strong>Show 24h Volume</strong>
            <small>Display rolling quote volume in USDT.</small>
          </span>
          <input id="settingVolume" type="checkbox">
        </label>

        <label class="setting-row">
          <span>
            <strong>Price Animation</strong>
            <small>Flash briefly when the last-trade price changes.</small>
          </span>
          <input id="settingAnimation" type="checkbox">
        </label>
      </div>

      <div class="privacy-note">
        <strong>Private by design</strong>
        <span>No account, tracking, analytics or API key.</span>
      </div>

      <footer class="footer settings-footer">
        <span>BTC LIVE · V1.0.0</span>
        <span>Local settings only</span>
      </footer>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
