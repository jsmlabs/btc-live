name: Verify

on:
  push:
    branches:
      - main
      - "maintenance/**"
  pull_request:
    branches:
      - main
      - "maintenance/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify
        run: npm run verify

      - name: Upload Chromium package
        uses: actions/upload-artifact@v4
        with:
          name: btc-live-chromium
          path: btc-live-chromium-v*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: btc-live-firefox
          path: btc-live-firefox-v*.zip
          if-no-files-found: error
          retention-days: 14
